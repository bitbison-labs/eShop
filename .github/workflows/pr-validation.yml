name: eShop Pull Request Validation

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:  
  test:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v4
      - name: Bitbison
        if: github.event_name != 'pull_request'
        uses: bitbison-labs/github@master
        with:
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}
          instance: ${{ secrets.BITBISON_INSTANCE }}
          label: eshop
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v3
      - name: Build 
        run: dotnet build eShop.Web.slnf
      - name: Test
        run: dotnet test --solution eShop.Web.slnf --no-build --no-progress --output detailed
      # The SDK's own container publish of WebApp to GHCR, not declared:
      # the analysis is to find the push on its own.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish WebApp image
        if: github.event_name != 'pull_request'
        run: >-
          dotnet publish src/WebApp/WebApp.csproj -c Release -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=bitbison-labs/eshop-webapp
          -p:ContainerImageTag=${{ github.sha }}